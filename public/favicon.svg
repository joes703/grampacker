<!-- Geometry only, no <text>: an SVG favicon renders in the browser's own
     process, so a font-family here would resolve against whatever the OS has
     and the mark would differ per platform. Paths render identically everywhere.
     Blue is blue-600 (#2563eb), the same token the primary buttons use. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <path d="M16 6.5 27 25.5H5z" fill="#fff"/>
  <path d="M11.9 13.5 14 16l2-2.4 2 2.4 2.1-2.5" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
