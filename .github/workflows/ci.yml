name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Raised from 10 on 2026-08-19, because 10 was set on 2026-07-07 when this
    # repo had a third of its current migrations and the number simply expired.
    #
    # The cost that grows is `test:migrations`. It replays EVERY migration
    # before each post-baseline one, so adding the Nth migration adds a whole
    # N-migration apply pass - the total grows with the square of the count,
    # not linearly. At six post-baseline migrations that step alone is ~2m45s
    # locally and roughly 3-4x that on a hosted runner, which put the whole job
    # at 9m32s and then tipped it over: two PRs died at exactly 10 minutes, and
    # a timeout is reported as "cancelled", which reads like someone pressed a
    # button rather than a budget being hit.
    #
    # 20 is about 2x current headroom, not a ceiling chosen for comfort: it
    # still catches a genuine hang, which is the only thing this setting is
    # for. Expect to revisit it - the growth is quadratic, so the honest fix
    # when this bites again is to make the harness cheaper (apply once and
    # snapshot, rather than re-applying per migration) rather than to keep
    # raising the number.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the migration-safety check diffs this branch's
          # migrations against origin/main, which a depth-1 checkout lacks.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + lint + vite build)
        run: npm run build

      - name: Test (unit + API on workerd)
        run: npm test

      # The API suite migrates an EMPTY database, so it cannot see a migration
      # that destroys existing rows - migration 0009 cascade-deleted every
      # list_items row past a fully green suite. This seeds a populated database
      # at origin/main's schema, applies this branch's new migrations through the
      # same code path deploy.yml uses against production, and fails if any row
      # vanished or changed. A no-op when the branch adds no migrations.
      - name: Test (migrations preserve data)
        run: npm run test:migrations

      # We pin actions by SHA because tags are mutable, and then rely on a
      # trailing `# v7.0.0` comment to say what the SHA is. Nothing checked that
      # comment until now: Dependabot moves the hash and leaves the label, so
      # #154 offered the right v7.0.0 SHA still marked `# v6`. Needs network -
      # it resolves each tag upstream - and fails closed if it cannot look.
      - name: Check (action pins match their tag comments)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:action-pins

      # A malformed dependabot.yml shipped twice before anything could validate
      # it. This catches only PARSE-level mistakes - duplicate keys, tabs, bad
      # indentation - which is what silently changes a config's meaning. It does
      # NOT check the schema: a misspelled key is valid YAML and Dependabot just
      # ignores it. See .yamllint.yml. Pinned so a linter release cannot fail an
      # unrelated PR.
      - name: Check (YAML parses as intended)
        run: pipx install yamllint==1.37.1 && yamllint .github/ .yamllint.yml
