name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the migration-safety check diffs this branch's
          # migrations against origin/main, which a depth-1 checkout lacks.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + lint + vite build)
        run: npm run build

      - name: Test (unit + API on workerd)
        run: npm test

      # The API suite migrates an EMPTY database, so it cannot see a migration
      # that destroys existing rows - migration 0009 cascade-deleted every
      # list_items row past a fully green suite. This seeds a populated database
      # at origin/main's schema, applies this branch's new migrations through the
      # same code path deploy.yml uses against production, and fails if any row
      # vanished or changed. A no-op when the branch adds no migrations.
      - name: Test (migrations preserve data)
        run: npm run test:migrations
