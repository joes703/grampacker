name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      # A fresh runner has no `wrangler telemetry disable` state, and this job
      # launches wrangler dozens of times.
      WRANGLER_SEND_METRICS: 'false'
    # `test:migrations` is the step that grows: the SQL it replays grows with
    # the square of the migration count, while process launches grow linearly -
    # and launches are what dominates the runtime today.
    #
    # 20 is a hang detector, not a budget. Lower it once several CI runs have
    # measured the current steady state. Full rationale and measurements:
    # docs/incidents.md.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the migration-immutability check below needs the
          # merge base with origin/main, which only a full fetch creates. The
          # migration-safety harness still reads no git at all - it scans the
          # migrations directory, not a diff.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + lint + vite build)
        run: npm run build

      - name: Test (unit + API on workerd)
        run: npm test

      # The API suite migrates an EMPTY database, so it cannot see a migration
      # that destroys existing rows - migration 0009 cascade-deleted every
      # list_items row past a fully green suite. This seeds a populated database
      # at origin/main's schema, applies this branch's new migrations through the
      # same code path deploy.yml uses against production, and fails if any row
      # vanished or changed. It re-tests EVERY post-baseline migration on every
      # run, whether or not this branch added one: the check is anchored to the
      # migrations directory, not to a diff, so a bad migration cannot ride to
      # production behind a later commit that touched no SQL.
      - name: Test (migrations preserve data)
        run: npm run test:migrations

      # A separate question from the step above, which replays the migrations
      # in the TREE and so cannot notice that one of them was edited. Wrangler
      # applies migrations by name and never re-runs one, so an edited 0027
      # replays clean here while production still holds the original text.
      # This refuses a pull request that changes any migration main already
      # holds. It is pull-request-only and skips itself on a push; what that
      # does and does not cover is in docs/testing-and-ci.md section 7.
      - name: Check (shipped migrations unchanged)
        run: node scripts/check-migration-immutability.mjs

      # We pin actions by SHA because tags are mutable, and then rely on a
      # trailing `# v7.0.0` comment to say what the SHA is. Nothing checked that
      # comment until now: Dependabot moves the hash and leaves the label, so
      # #154 offered the right v7.0.0 SHA still marked `# v6`. Needs network -
      # it resolves each tag upstream - and fails closed if it cannot look.
      - name: Check (action pins match their tag comments)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:action-pins

      # A malformed dependabot.yml shipped twice before anything could validate
      # it. This catches only PARSE-level mistakes - duplicate keys, tabs, bad
      # indentation - which is what silently changes a config's meaning. It does
      # NOT check the schema: a misspelled key is valid YAML and Dependabot just
      # ignores it. See .yamllint.yml. Pinned so a linter release cannot fail an
      # unrelated PR.
      - name: Check (YAML parses as intended)
        run: pipx install yamllint==1.37.1 && yamllint .github/ .yamllint.yml
