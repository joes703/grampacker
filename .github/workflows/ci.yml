name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      # A fresh runner has no `wrangler telemetry disable` state.
      WRANGLER_SEND_METRICS: 'false'
    # A hang detector, not a budget.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: both migration checks need the merge base with
          # origin/main, which only a full fetch creates.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + lint + vite build + server build)
        run: npm run build

      - name: Test (unit + API on Node/SQLite)
        run: npm test

      # Drizzle bookkeeping, snapshot matches schema.ts, and no table rebuild,
      # rename or DROP TABLE in a new migration (docs/testing-and-ci.md
      # section 7).
      - name: Check (migrations)
        run: npm run test:migrations

      # Refuses a pull request that edits a migration main already holds:
      # production applies migrations by name and never re-runs one.
      # Pull-request-only; skips itself on a push.
      - name: Check (shipped migrations unchanged)
        run: node scripts/check-migration-immutability.mjs

      # We pin actions by SHA because tags are mutable, and then rely on a
      # trailing `# v7.0.0` comment to say what the SHA is. Nothing checked that
      # comment until now: Dependabot moves the hash and leaves the label, so
      # #154 offered the right v7.0.0 SHA still marked `# v6`. Needs network -
      # it resolves each tag upstream - and fails closed if it cannot look.
      - name: Check (action pins match their tag comments)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:action-pins

      # A malformed dependabot.yml shipped twice before anything could validate
      # it. This catches only PARSE-level mistakes - duplicate keys, tabs, bad
      # indentation - which is what silently changes a config's meaning. It does
      # NOT check the schema: a misspelled key is valid YAML and Dependabot just
      # ignores it. See .yamllint.yml. Pinned so a linter release cannot fail an
      # unrelated PR.
      - name: Check (YAML parses as intended)
        run: pipx install yamllint==1.37.1 && yamllint .github/ .yamllint.yml
