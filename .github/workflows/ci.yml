name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The checkout/node/install/build/test/migrations steps are deliberately
  # duplicated in image.yml's pre-publish job, which re-proves a commit at
  # dispatch time. A reusable workflow would remove the copy but add a third
  # workflow file with its own pin and permissions surface. If a step here
  # changes, change its copy in image.yml in the same commit.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # A hang detector, not a budget.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: both migration checks need the merge base with
          # origin/main, which only a full fetch creates.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + lint + vite build + server build)
        run: npm run build

      - name: Test (unit + API on Node/SQLite)
        run: npm test

      # Drizzle bookkeeping, snapshot matches schema.ts, and no table rebuild,
      # rename or DROP TABLE in a new migration (docs/testing-and-ci.md
      # section 7).
      - name: Check (migrations)
        run: npm run test:migrations

      # Refuses a pull request that edits a migration main already holds:
      # production applies migrations by name and never re-runs one.
      - name: Check (shipped migrations unchanged)
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-safety.mjs --immutability

      # Every action pinned to a full commit SHA with a `# <tag>` comment.
      # Offline: it does not check that the comment matches the SHA.
      - name: Check (action pins)
        run: npm run check:action-pins
