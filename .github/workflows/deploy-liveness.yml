# Alerts when main has moved ahead of what is actually running in production.
#
# WHY THIS EXISTS
# ---------------
# deploy.yml has two failure modes that are SILENT by construction:
#
#   1. Its `workflow_run` listener matches CI by DISPLAY NAME. Renaming the CI
#      workflow stops deployment dead, with no error anywhere - the trigger
#      simply never fires again.
#   2. A stale-SHA run exits SUCCESS without deploying. That is correct
#      behavior (see deploy.yml), but it means a bug in the comparison would
#      also look like a healthy green run that quietly shipped nothing.
#
# Both leave a green Actions tab and an un-deployed production. This job is the
# only thing that would notice.
#
# It is ADVISORY and never mutates production. It reads deployment records and
# git refs, and opens an issue. That is all it can do.
name: Deploy liveness

on:
  # Every 6 hours. Deliberately not tighter: this is a single-user app where a
  # missed deploy is an inconvenience rather than an outage, and a noisy
  # watchdog is one that gets muted.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read # read main's head commit
  deployments: read # read the marker deploy.yml writes
  actions: read # inspect recent deploy runs when explaining a gap
  issues: write # the alert channel

jobs:
  check:
    name: Check production is current
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main

      - name: Compare main against the deployment marker
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          head_sha=$(git rev-parse HEAD)
          head_epoch=$(git log -1 --format=%ct HEAD)
          now=$(date +%s)
          age=$(( now - head_epoch ))

          # A deploy in flight is not a fault. Two hours is comfortably longer
          # than deploy.yml's 10-minute timeout plus any queueing behind the
          # deploy-production concurrency group.
          if [ "$age" -lt 7200 ]; then
            echo "state=fresh" >> "$GITHUB_OUTPUT"
            echo "main head is ${age}s old; too new to judge. Skipping."
            exit 0
          fi

          # Reads the NEWEST production deployment record and the state of its
          # latest status. A record whose status never landed proves the marker
          # is incomplete, not that an older SHA is running, so there is no
          # fallback to an older success - see the script's header.
          result=$(node scripts/deployed-sha.mjs "$head_sha")
          state=${result%%$'\t'*}
          deployed_sha=${result#*$'\t'}

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          case "$state" in
            current) echo "Production is current at $head_sha." ;;
            behind) echo "Newest successful marker is $deployed_sha; main is $head_sha." ;;
            unverified) echo "Newest record ($deployed_sha) does not establish a successful deployment; production state is unverified." ;;
            no-marker) echo "No production deployment records exist." ;;
          esac

      - name: Open or update the liveness issue
        if: >-
          steps.check.outputs.state == 'behind' ||
          steps.check.outputs.state == 'unverified' ||
          steps.check.outputs.state == 'no-marker'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.check.outputs.state }}
          HEAD_SHA: ${{ steps.check.outputs.head_sha }}
          DEPLOYED_SHA: ${{ steps.check.outputs.deployed_sha }}
        run: |
          set -euo pipefail
          # One title for every state: "main is ahead of production" was not
          # true of a marker we cannot verify, and a state-dependent title
          # would file a second issue whenever the state changed.
          title="deploy liveness: production state needs attention"
          # The title used before 2026-09-06, still recognized so an issue
          # opened under it is updated rather than duplicated beside a new one.
          old_title="deploy liveness: main is ahead of production"

          # What every state has in common, so it is written once: this check
          # reads GitHub's record of the last deployment JOB. It never observes
          # Cloudflare, so it cannot tell you what the Worker is actually
          # serving - after an ambiguous deploy failure, verify production by
          # hand.
          caveat="This check reads GitHub deployment records, not Cloudflare.
          It reports what the last deployment job RECORDED, so verify
          production by hand if a deploy failed ambiguously."

          # Shared by the two states that mean "a deploy may have half
          # happened". It must NOT name a SHA as the deployed one: a run whose
          # record-creation POST failed leaves the newest record pointing at an
          # EARLIER commit than the one that run actually deployed.
          repair="- If a Deploy run FAILED at any step except \"Record deployment
            marker\": re-run it with \`gh run rerun --failed <deploy-run-id>\`. A
            re-run keeps that run's commit and workflow file, and the deploy job
            re-verifies CI is green for main's head before doing anything. This
            includes a run where migrations applied and \"Deploy Worker\" failed:
            \`wrangler d1 migrations apply\` skips migrations already recorded by
            name, so the re-run only retries the Worker swap.
          - If it failed ONLY at \"Record deployment marker\" (its log says
            production is running the new SHA and not to re-run): do NOT re-run.
            Read that run's log for the SHA it deployed - which need not be the
            SHA on the newest record - and create the marker by hand with the
            same two API calls the step makes (a deployment for that SHA, then a
            success status).
          - If no Deploy run fired at all: re-run main's CI run with
            \`gh run rerun <ci-run-id>\`; its completion fires the
            \`workflow_run\` trigger again. Or land a new commit on main through
            a PR."

          if [ "$STATE" = "no-marker" ]; then
            body="No production deployment records exist.

          Either nothing has deployed since the marker was introduced, or the
          marker step in \`deploy.yml\` is failing.

          main is at \`$HEAD_SHA\`.

          $repair

          $caveat"
          elif [ "$STATE" = "unverified" ]; then
            body="The deployment records do not establish a successful deployment.
          The newest record is for \`$DEPLOYED_SHA\` - though if two records tie
          at the same timestamp that is only ONE of them, and their statuses
          were not consulted at all.

          Either that record has no latest status, or its latest status is not a
          success, or the newest records or statuses tie at the same second
          without agreeing.

          **This does not mean production is running something older.** The
          record is evidence that a deploy STARTED; without a success status it
          is not evidence of what finished. A deploy that changed production and
          then failed to record itself looks exactly like this.

          main is at \`$HEAD_SHA\`.

          $repair

          $caveat"
          else
            body="The newest successful production deployment marker is
          \`$DEPLOYED_SHA\`, and main is at \`$HEAD_SHA\`.

          Likely causes, in order of how often they bite:

          1. The CI workflow was renamed. \`deploy.yml\` listens for a
             \`workflow_run\` from a workflow named exactly \`CI\`; renaming it
             silently stops all deployment.
          2. A deploy failed. Check the Actions tab.
          3. Every recent Deploy run decided it was stale and skipped.

          To recover (there is deliberately no manual dispatch - see the header
          of \`deploy.yml\`):

          $repair

          $caveat"
          fi

          # Idempotent: update the existing open issue rather than filing a new
          # one every 6 hours.
          #
          # The search is only a PREFILTER - `in:title` restricts the field, it
          # does not anchor or prefix-match, so "Improve deploy liveness
          # diagnostics" would match it. The returned titles are therefore
          # compared EXACTLY against the two this workflow has ever used, so it
          # can never comment on someone's unrelated issue (and, worse, skip
          # filing the real alert). Both titles are plain text with nothing jq
          # would have to escape; keep them that way.
          existing=$(gh issue list --state open --search '"deploy liveness" in:title' \
            --json number,title --jq \
            "[.[] | select(.title == \"$title\" or .title == \"$old_title\")] | .[0].number // \"\"")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated issue #$existing."
          else
            gh issue create --title "$title" --body "$body"
          fi
