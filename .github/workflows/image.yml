# Builds the production container image and tests it as a running container.
#
#   * pull_request: build and scripts/check-image.sh only. Read-only token;
#     publishes nothing. ci.yml runs the other checks.
#   * workflow_dispatch, main only: reruns the build, unit, API and migration
#     checks on `github.sha`, builds and checks the image, pushes it as
#     ghcr.io/joes703/grampacker:<full commit SHA> and prints its digest.
#     With the true/false `deploy` input set, a last job deploys that digest
#     to the VPS over the tailnet (docs/vps-runbook.md, "Deploy"). The input
#     is read only by a job's `if`: no typed value reaches a command, and no
#     one can name an image or a digest.
#
# There is no push trigger: each publish is started by hand. Nothing here
# changes DNS or the public route.
#
# Every job that runs on a dispatch requires `github.ref == 'refs/heads/main'`.
# Only the publish job has `packages: write`; only the deploy job reads
# secrets, from the `production` environment, which admits main only. Why
# this is safe, and what it does not protect: SECURITY.md, "Supply chain".
# Actions are pinned to full commit SHAs; the one third-party action is
# tailscale/github-action in the deploy job.
name: Image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Also deploy the published image to the VPS
        type: boolean
        default: false

# Nothing by default. Each job asks for what it needs.
permissions: {}

jobs:
  # Pull requests: prove the image builds and passes its checks. No push.
  check:
    name: Build and check image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (linux/amd64)
        run: docker build --platform linux/amd64 --provenance=false -t grampacker:check .

      - name: Check image (scripts/check-image.sh)
        run: scripts/check-image.sh grampacker:check

  # Manual publish, step 1: build, unit, API and migration checks on this
  # commit. ci.yml also checks shipped migrations and action pins;
  # those run on the pull request that brought the commit to main.
  # These steps are deliberate copies of ci.yml's verify job (a reusable
  # workflow would add a third file with its own pin and permissions
  # surface); a change to one copy moves the other in the same commit.
  # Never name a job here "Verify": that is the ruleset's required check
  # (ci.yml), and this job reports "skipped" on every pull request.
  verify:
    name: Pre-publish checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'joes703/grampacker'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The migration check needs origin/main and its history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + lint + vite build + server build)
        run: npm run build

      - name: Test (unit + API on Node/SQLite)
        run: npm test

      - name: Check (migrations)
        run: npm run test:migrations

  # Manual publish, step 2: build, test the container, push, record the digest.
  publish:
    name: Publish image to GHCR
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'joes703/grampacker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publish at a time; never cancel one halfway through a push.
    concurrency:
      group: image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      # Push to ghcr.io/joes703/grampacker with the run's own GITHUB_TOKEN.
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    env:
      IMAGE_REPO: ghcr.io/joes703/grampacker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The token stays out of .git/config, so no later step can read it.
          persist-credentials: false

      - name: Confirm the checkout is the dispatched commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      # The source label links the GHCR package to this repository on its
      # first push. The revision label records the commit inside the image.
      - name: Build image (linux/amd64)
        run: >-
          docker build --platform linux/amd64 --provenance=false
          --label "org.opencontainers.image.source=https://github.com/joes703/grampacker"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t grampacker:check .

      # Before any login: the image under test never runs with a registry
      # credential on the machine.
      - name: Check image (scripts/check-image.sh)
        run: scripts/check-image.sh grampacker:check

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push and record the digest
        id: publish
        run: scripts/publish-image.sh grampacker:check "$IMAGE_REPO" "$GITHUB_SHA"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # Manual publish, step 3, only when the dispatch set `deploy`: deploys the
  # digest the publish job above pushed and checked, never a tag or a typed
  # value. A failed deploy is not rolled back automatically. If it reaches the
  # guarded deployment phase, the VPS reports whether maintenance is on and
  # which rollback directory exists; a person decides
  # (`docs/vps-runbook.md`, "Failed deploy").
  deploy:
    name: Deploy to the VPS
    needs: publish
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'joes703/grampacker' &&
      inputs.deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # One deploy at a time, and never canceled once started. GitHub keeps at
    # most one more waiting; a newer dispatch replaces it before it starts.
    # Canceling the run, or the timeout, ends only the SSH connection: the
    # deploy itself goes on to the end on the VPS.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # No GITHUB_TOKEN permissions, no checkout: this job joins the tailnet
    # and runs ssh.
    permissions: {}
    steps:
      # The Tailscale values feed the action step below, which cannot point
      # at the runbook when one is missing, so check them first.
      - name: Check the Tailscale secrets are set
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        shell: bash
        run: |
          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; then
            echo "::error::TS_OAUTH_CLIENT_ID or TS_OAUTH_SECRET is not set (docs/vps-runbook.md, 'Recreate deployment access')"
            exit 1
          fi

      # The provider firewall blocks public port 22; sshd answers only over
      # the tailnet. This joins the runner as an ephemeral node tagged ci,
      # which the tailnet policy lets reach only the VPS on port 22; the
      # action's post step logs the node out. `ping` waits for peer
      # connectivity, so the ssh step's 30-second timeout starts only once
      # the tailnet path works. The pinned action installs a fixed Tailscale
      # version (its action.yml default).
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Deploy the published digest over SSH
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the publish job gave no digest"; exit 1; }
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_HOST, DEPLOY_KNOWN_HOSTS or DEPLOY_SSH_KEY is not set (see docs/vps-runbook.md)"
            exit 1
          fi
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          ( umask 077
            printf '%s\n' "$DEPLOY_SSH_KEY" >"$dir/key"
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$dir/known_hosts" )
          # The host key is the one pinned in DEPLOY_KNOWN_HOSTS. Never
          # ssh-keyscan: that trusts whatever answers.
          ssh -F none -T -i "$dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 \
            "deploy@$DEPLOY_HOST" "deploy $DIGEST"
