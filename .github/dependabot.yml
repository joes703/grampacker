# Keeps direct and transitive dependencies current alongside GitHub's security
# updates.
#
# ONE GROUP PER ECOSYSTEM, ON PURPOSE
# -----------------------------------
# Do not split npm updates by semver level or by package family. A group can
# only combine updates that are eligible in the SAME run, so a different wait
# per semver level pushes related packages into separate runs. Family groups
# work only if every family is listed in advance; a missed one lets a PR move
# react-dom without react (react-dom declares a peer of react), and CI does not
# catch it: `npm ci` never re-resolves, and `npm install` re-resolves only when
# package.json and the lockfile disagree.
#
# One group per ecosystem needs no such list. Everything non-major moves
# in a single resolution, so no family has to be known about ahead of time.
# Majors still arrive on their own, which is where release notes get read.
#
# This is coordination, not a guarantee - a major landing beside a minor still
# splits. The real check on any of it is the CI gate: build plus the full test
# suite. If a grouped PR goes red, the fallback is to close it and let the next
# run rebuild it, or hand-author the branch; you cannot drop one package from a
# Dependabot-authored group PR in place.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

    # One layer, not a shield. The npm worm campaigns are usually detected and
    # the poisoned versions yanked within hours to days of publication, so a week
    # on the registry reduces that exposure; it does not guarantee a release is
    # safe, and does nothing about a patient backdoor.
    #
    # Version updates only. Dependabot security-update PRs bypass this cooldown
    # and the schedule, if the dependency graph, Dependabot alerts and
    # Dependabot security updates are enabled in repository settings (this file
    # cannot turn them on). Advisories Dependabot has not seen, and what to do
    # about them: SECURITY.md "Supply chain".
    cooldown:
      default-days: 7

    groups:
      non-major:
        patterns: ['*']
        update-types: [minor, patch]

  # AGENTS.md requires third-party actions to be pinned to a full commit SHA.
  # That pin is what makes a workflow reproducible, but it also means an action
  # never picks up an upstream fix unless something moves the SHA. This is what
  # moves it.
  #
  # Do NOT add semver-major-days / semver-minor-days / semver-patch-days here.
  # They are real Dependabot keys, but they are NOT supported for the
  # github-actions ecosystem, and an unsupported key risks failing config
  # validation - which would silently disable everything in this file.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      non-major:
        patterns: ['*']
        update-types: [minor, patch]

  # The Node base image: the Dockerfile's `FROM node:<version>-trixie-slim@
  # sha256:...` line, which production runs. Dependabot moves the version tag
  # and the digest together. It reads only a literal FROM line, never an
  # image named through an ARG.
  #
  # Daily and with no cooldown, unlike the two entries above. No Dependabot
  # security update ever covers a container image, so these version updates
  # are the only way Node and Debian security fixes arrive; a wait would
  # delay exactly those. The image comes from Docker's official-images
  # build, not from a package anyone can publish, and the PR is still
  # reviewed and merged by hand. There is one dependency, so a newer update
  # replaces an open PR rather than adding one.
  #
  # Majors are ignored: an odd major is never LTS, and moving to the next
  # LTS major is a planned change, due before Node 24's end of life
  # (2028-04-30).
  #
  # Dependabot may not raise a PR when the SAME tag is rebuilt for Debian
  # fixes (dependabot-core #15103 can turn those off). The monthly check in
  # docs/vps-runbook.md, "Routine maintenance", catches
  # a rebuilt tag that no PR has moved.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
