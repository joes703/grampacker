# yamllint config for this repo's YAML (workflows + dependabot).
#
# WHY THIS EXISTS: a malformed dependabot.yml shipped twice with nothing able to
# machine-validate it. This catches the class of mistake that stops a file being
# PARSED the way you meant - duplicate keys, bad indentation, tab characters.
#
# WHAT IT DOES NOT DO: schema validation. A dependabot.yml with a misspelled key
# or an invalid package-ecosystem is perfectly valid YAML and Dependabot will
# silently ignore it. GitHub validates that server-side and reports it under
# Insights > Dependency graph > Dependabot. That remains the real check for
# whether a config MEANS what you intended; this only checks it PARSES.
#
# Everything disabled below is disabled because it fires on correct, idiomatic
# GitHub Actions YAML. A linter that warns about files that are fine is a
# linter people learn to ignore, which is worse than not having one.
extends: default

rules:
  # `on:` is THE GitHub Actions trigger key. The truthy rule reads it as the
  # YAML 1.1 boolean `on` and flags every workflow we will ever write. Keys are
  # not where an accidental truthy value hurts, so only check values.
  truthy:
    check-keys: false

  # `uses: owner/repo@<sha> # v7.0.0` is the documented Actions pinning form and
  # what scripts/check-action-pins.mjs parses. yamllint's default wants two
  # spaces before a trailing comment; the convention uses one.
  comments:
    min-spaces-from-content: 1

  # Long lines here are shell one-liners inside `run:` blocks, where wrapping
  # costs readability and buys nothing. Length is not a correctness property.
  line-length: disable

  # Workflows are single-document files. A leading `---` is noise.
  document-start: disable
